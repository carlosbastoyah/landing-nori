<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Flujos inteligentes</title>
  <desc id="desc">Ilustracion de un flujo automatizado con nodos conectados y un nodo activo destacado.</desc>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3640"/>
      <stop offset="1" stop-color="#103f47"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a9e0c3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9e0c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fnode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fffa"/>
      <stop offset="1" stop-color="#a9e0c3"/>
    </linearGradient>
    <filter id="fsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04181c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#fbg)"/>

  <circle cx="235" cy="470" r="2" fill="#d9f0e4" opacity="0.5"/>
  <circle cx="300" cy="140" r="2.4" fill="#d9f0e4" opacity="0.5"/>
  <circle cx="820" cy="420" r="2.2" fill="#d9f0e4" opacity="0.5"/>
  <circle cx="700" cy="520" r="2" fill="#d9f0e4" opacity="0.4"/>
  <circle cx="150" cy="260" r="2" fill="#d9f0e4" opacity="0.4"/>

  <circle cx="565" cy="300" r="190" fill="url(#fglow)"/>

  <path d="M220 430C280 400 320 340 400 300C450 276 490 320 565 300C640 280 670 220 745 190" stroke="#d9f0e4" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" fill="none" opacity="0.65"/>

  <g>
    <circle cx="220" cy="430" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="220" cy="430" r="30" fill="none" stroke="#d9f0e4" stroke-width="2" opacity="0.55"/>
    <circle cx="220" cy="430" r="6" fill="#d9f0e4"/>
  </g>

  <g>
    <circle cx="400" cy="300" r="34" fill="#ffffff" opacity="0.08"/>
    <circle cx="400" cy="300" r="34" fill="none" stroke="#d9f0e4" stroke-width="2" opacity="0.55"/>
    <path d="M388 300l8 8 18-20" stroke="#f5fffa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g filter="url(#fsh)">
    <circle cx="565" cy="300" r="58" fill="url(#fnode)"/>
    <path d="M572 254l-38 58h30l-8 66 46-70h-32z" fill="#0e4952"/>
  </g>

  <g>
    <circle cx="745" cy="190" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="745" cy="190" r="30" fill="none" stroke="#d9f0e4" stroke-width="2" opacity="0.55"/>
    <circle cx="745" cy="190" r="6" fill="#d9f0e4"/>
  </g>

  <path d="M775 195l16-10-4 18z" fill="#d9f0e4" opacity="0.7"/>
</svg>
