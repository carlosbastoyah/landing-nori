<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Reporteria personalizable</title>
  <desc id="desc">Ilustracion de un panel con grafico de barras, anillo de progreso y tarjeta de KPI.</desc>
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2f37"/>
      <stop offset="1" stop-color="#103f47"/>
    </linearGradient>
    <linearGradient id="rpanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2faf7"/>
    </linearGradient>
    <linearGradient id="rbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e0c3"/>
      <stop offset="1" stop-color="#4d8b90"/>
    </linearGradient>
    <filter id="rsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#04181c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#rbg)"/>

  <circle cx="180" cy="150" r="2.4" fill="#d9f0e4" opacity="0.5"/>
  <circle cx="820" cy="180" r="2.2" fill="#d9f0e4" opacity="0.5"/>
  <circle cx="200" cy="520" r="2" fill="#d9f0e4" opacity="0.4"/>
  <circle cx="150" cy="360" r="10" fill="#a9e0c3" opacity="0.2"/>
  <circle cx="810" cy="460" r="14" fill="#4d8b90" opacity="0.22"/>

  <g filter="url(#rsh)">
    <rect x="150" y="120" width="660" height="400" rx="34" fill="url(#rpanel)"/>
  </g>

  <rect x="200" y="170" width="150" height="70" rx="18" fill="#0e4952"/>
  <rect x="220" y="196" width="70" height="12" rx="6" fill="#a9e0c3"/>
  <rect x="220" y="216" width="46" height="10" rx="5" fill="#d9f0e4" opacity="0.7"/>

  <rect x="205" y="360" width="40" height="100" rx="12" fill="url(#rbar)"/>
  <rect x="257" y="320" width="40" height="140" rx="12" fill="url(#rbar)" opacity="0.85"/>
  <rect x="309" y="380" width="40" height="80" rx="12" fill="url(#rbar)" opacity="0.7"/>
  <rect x="361" y="300" width="40" height="160" rx="12" fill="url(#rbar)"/>
  <rect x="413" y="350" width="40" height="110" rx="12" fill="url(#rbar)" opacity="0.85"/>

  <circle cx="640" cy="300" r="76" fill="none" stroke="#e3f2ec" stroke-width="22"/>
  <circle cx="640" cy="300" r="76" fill="none" stroke="#1f5f68" stroke-width="22" stroke-linecap="round" stroke-dasharray="358 478" transform="rotate(-90 640 300)"/>
  <circle cx="640" cy="300" r="34" fill="#a9e0c3"/>
</svg>
