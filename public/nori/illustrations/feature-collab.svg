<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Colaboracion clinica</title>
  <desc id="desc">Ilustracion de tres roles conectados en red con un mensaje flotante de seguimiento.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fefd"/>
      <stop offset="1" stop-color="#eaf7f4"/>
    </linearGradient>
    <linearGradient id="lmint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f0e4"/>
      <stop offset="1" stop-color="#a9e0c3"/>
    </linearGradient>
    <linearGradient id="locean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fa5a9"/>
      <stop offset="1" stop-color="#316b71"/>
    </linearGradient>
    <filter id="lsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0e4952" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#lbg)"/>

  <circle cx="200" cy="500" r="10" fill="#4d8b90" opacity="0.3"/>
  <circle cx="800" cy="530" r="14" fill="#1f5f68" opacity="0.18"/>
  <circle cx="810" cy="140" r="8" fill="#0e4952" opacity="0.28"/>

  <path d="M370 300C440 260 540 260 590 300" stroke="#a9e0c3" stroke-width="3" stroke-dasharray="2 9" fill="none" opacity="0.8"/>
  <path d="M330 380C400 420 540 430 610 380" stroke="#a9e0c3" stroke-width="3" stroke-dasharray="2 9" fill="none" opacity="0.8"/>

  <circle cx="330" cy="330" r="96" fill="url(#lmint)" stroke="#ffffff" stroke-width="8"/>
  <circle cx="610" cy="330" r="106" fill="url(#locean)" stroke="#ffffff" stroke-width="8"/>
  <circle cx="470" cy="450" r="86" fill="#0e4952" stroke="#ffffff" stroke-width="8" opacity="0.92"/>

  <circle cx="290" cy="260" r="16" fill="#ffffff" filter="url(#lsh)"/>
  <path d="M282 260h16M290 252v16" stroke="#4d8b90" stroke-width="3" stroke-linecap="round"/>

  <circle cx="660" cy="240" r="16" fill="#ffffff" filter="url(#lsh)"/>
  <path d="M652 240h16" stroke="#1f5f68" stroke-width="3" stroke-linecap="round"/>
  <path d="M660 232v16" stroke="#1f5f68" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#lsh)">
    <rect x="600" y="120" width="176" height="104" rx="26" fill="#ffffff"/>
    <path d="M636 224l-14 26 8-30z" fill="#ffffff"/>
    <circle cx="642" cy="172" r="9" fill="#a9e0c3"/>
    <circle cx="678" cy="172" r="9" fill="#4d8b90"/>
    <circle cx="714" cy="172" r="9" fill="#0e4952"/>
  </g>
</svg>
